[workspace]
resolver = "2"
members = [
	"crates/ps88",
	"crates/assets/roboto-mono",
	"crates/assets/material-design-icons",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0"
version = "0.1.0"

[workspace.dependencies]
roboto-mono = { path = "crates/assets/roboto-mono" }
material-design-icons = { path = "crates/assets/material-design-icons" }
